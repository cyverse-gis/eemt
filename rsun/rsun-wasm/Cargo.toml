[package]
name = "rsun-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly solar radiation demo via WebGPU (small DEMs only)"
license = "GPL-2.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rsun-core = { path = "../rsun-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "s"     # optimize for small wasm binary
lto = true
