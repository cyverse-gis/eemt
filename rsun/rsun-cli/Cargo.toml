[package]
name = "rsun-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rsun"
path = "src/main.rs"

[features]
default = ["cuda"]
cuda = ["dep:rsun-cuda"]

[dependencies]
rsun-core = { path = "../rsun-core", features = ["io"] }
rsun-gpu = { path = "../rsun-gpu" }
rsun-cuda = { path = "../rsun-cuda", optional = true }
clap = { version = "4", features = ["derive"] }
