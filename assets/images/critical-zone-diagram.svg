<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="organic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="topsoil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="subsoil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="weathered" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8a29e"/>
      <stop offset="100%" stop-color="#78716c"/>
    </linearGradient>
    <linearGradient id="bedrock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#57534e"/>
      <stop offset="100%" stop-color="#44403c"/>
    </linearGradient>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Sky -->
  <rect width="720" height="440" rx="12" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="620" cy="50" r="28" fill="#fbbf24" opacity="0.9"/>
  <g stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.5">
    <line x1="620" y1="14" x2="620" y2="6"/>
    <line x1="645" y1="25" x2="650" y2="20"/>
    <line x1="656" y1="50" x2="664" y2="50"/>
    <line x1="645" y1="75" x2="650" y2="80"/>
    <line x1="595" y1="75" x2="590" y2="80"/>
    <line x1="584" y1="50" x2="576" y2="50"/>
    <line x1="595" y1="25" x2="590" y2="20"/>
  </g>

  <!-- Vegetation canopy -->
  <g opacity="0.95">
    <ellipse cx="140" cy="90" rx="38" ry="45" fill="#15803d"/>
    <ellipse cx="200" cy="85" rx="32" ry="40" fill="#16a34a"/>
    <ellipse cx="260" cy="95" rx="42" ry="50" fill="#15803d"/>
    <ellipse cx="330" cy="88" rx="35" ry="43" fill="#16a34a"/>
    <ellipse cx="400" cy="98" rx="40" ry="48" fill="#15803d"/>
    <ellipse cx="465" cy="85" rx="30" ry="38" fill="#16a34a"/>
    <ellipse cx="520" cy="92" rx="36" ry="44" fill="#15803d"/>
  </g>

  <!-- Tree trunks -->
  <g fill="#92400e">
    <rect x="137" y="120" width="6" height="20" rx="2"/>
    <rect x="197" y="115" width="5" height="25" rx="2"/>
    <rect x="257" y="125" width="6" height="15" rx="2"/>
    <rect x="327" y="118" width="5" height="22" rx="2"/>
    <rect x="397" y="128" width="6" height="12" rx="2"/>
    <rect x="462" y="115" width="5" height="25" rx="2"/>
    <rect x="517" y="122" width="6" height="18" rx="2"/>
  </g>

  <!-- Ground surface line -->
  <path d="M40 140 Q180 132 360 138 Q540 144 680 140" stroke="#78350f" stroke-width="2" fill="none"/>

  <!-- Soil layers -->
  <rect x="40" y="140" width="640" height="22" rx="0" fill="url(#organic)" opacity="0.9"/>
  <rect x="40" y="162" width="640" height="38" rx="0" fill="url(#topsoil)" opacity="0.85"/>
  <rect x="40" y="200" width="640" height="50" rx="0" fill="url(#subsoil)" opacity="0.8"/>
  <rect x="40" y="250" width="640" height="55" rx="0" fill="url(#weathered)" opacity="0.75"/>
  <rect x="40" y="305" width="640" height="65" rx="0" fill="url(#bedrock)" opacity="0.9"/>

  <!-- Groundwater zone -->
  <rect x="40" y="370" width="640" height="40" rx="0" fill="#3b82f6" opacity="0.2"/>

  <!-- Layer labels -->
  <g font-size="11" font-weight="500" fill="white">
    <text x="60" y="156">O Horizon</text>
    <text x="60" y="186">A Horizon (Topsoil)</text>
    <text x="60" y="230">B Horizon (Subsoil)</text>
  </g>
  <g font-size="11" font-weight="500">
    <text x="60" y="282" fill="rgba(255,255,255,0.9)">C Horizon (Weathered Rock)</text>
    <text x="60" y="344" fill="rgba(255,255,255,0.85)">Bedrock</text>
    <text x="60" y="395" fill="#1d4ed8">Groundwater</text>
  </g>

  <!-- Critical Zone boundary -->
  <rect x="35" y="70" width="650" height="340" rx="8" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="12,6" opacity="0.7"/>
  <rect x="542" y="56" width="120" height="22" rx="4" fill="#ef4444" opacity="0.9"/>
  <text x="602" y="72" font-size="12" font-weight="700" fill="white" text-anchor="middle">Critical Zone</text>

  <!-- Solar radiation arrows -->
  <g stroke="#f59e0b" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)" opacity="0.8">
    <line x1="150" y1="35" x2="150" y2="65"/>
    <line x1="280" y1="30" x2="280" y2="60"/>
    <line x1="410" y1="35" x2="410" y2="68"/>
    <line x1="530" y1="30" x2="530" y2="62"/>
  </g>

  <!-- Precipitation -->
  <g fill="#3b82f6" opacity="0.6">
    <circle cx="170" cy="48" r="2.5"/>
    <circle cx="175" cy="58" r="2"/>
    <circle cx="310" cy="45" r="2.5"/>
    <circle cx="315" cy="55" r="2"/>
    <circle cx="450" cy="48" r="2.5"/>
    <circle cx="455" cy="58" r="2"/>
  </g>

  <!-- Infiltration arrows -->
  <g stroke="#3b82f6" stroke-width="1.5" fill="none" stroke-dasharray="5,4" opacity="0.5" marker-end="url(#arrow-blue)">
    <line x1="200" y1="140" x2="200" y2="200"/>
    <line x1="350" y1="140" x2="350" y2="220"/>
    <line x1="500" y1="140" x2="500" y2="200"/>
  </g>

  <!-- Energy flux (downward through CZ) -->
  <g stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrow-red)" opacity="0.5">
    <line x1="260" y1="200" x2="260" y2="300"/>
    <line x1="420" y1="200" x2="420" y2="300"/>
  </g>

  <!-- Legend -->
  <g transform="translate(40, 420)">
    <g font-size="10" font-weight="500">
      <line x1="0" y1="-4" x2="20" y2="-4" stroke="#f59e0b" stroke-width="2.5"/>
      <text x="25" y="0" fill="#78716c">Solar Radiation</text>

      <circle cx="120" cy="-4" r="3" fill="#3b82f6" opacity="0.6"/>
      <text x="128" y="0" fill="#78716c">Precipitation</text>

      <line x1="220" y1="-4" x2="240" y2="-4" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,4"/>
      <text x="245" y="0" fill="#78716c">Infiltration</text>

      <line x1="330" y1="-4" x2="350" y2="-4" stroke="#ef4444" stroke-width="2"/>
      <text x="355" y="0" fill="#78716c">Energy Flux</text>

      <line x1="440" y1="-4" x2="460" y2="-4" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="12,6" opacity="0.7"/>
      <text x="465" y="0" fill="#78716c">Critical Zone Boundary</text>
    </g>
  </g>
</svg>
