<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e32"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="terrain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="40" fill="url(#bg)"/>

  <!-- Sun with glow -->
  <circle cx="100" cy="52" r="16" fill="url(#sun)" filter="url(#glow)"/>
  <g stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line x1="100" y1="28" x2="100" y2="22"/>
    <line x1="117" y1="35" x2="121" y2="31"/>
    <line x1="124" y1="52" x2="130" y2="52"/>
    <line x1="117" y1="69" x2="121" y2="73"/>
    <line x1="83" y1="69" x2="79" y2="73"/>
    <line x1="76" y1="52" x2="70" y2="52"/>
    <line x1="83" y1="35" x2="79" y2="31"/>
  </g>

  <!-- Energy flux arrows -->
  <g stroke="rgba(251,191,36,0.6)" stroke-width="1.5" fill="none" stroke-dasharray="4,3">
    <line x1="70" y1="72" x2="58" y2="108"/>
    <line x1="100" y1="72" x2="100" y2="108"/>
    <line x1="130" y1="72" x2="142" y2="108"/>
  </g>

  <!-- Terrain profile -->
  <path d="M20 130 Q40 118 60 122 Q80 108 100 115 Q120 100 140 110 Q160 118 180 125 L180 165 Q100 170 20 165 Z"
        fill="url(#terrain)" opacity="0.9"/>

  <!-- Subtle precipitation dots -->
  <g fill="rgba(255,255,255,0.4)">
    <circle cx="45" cy="88" r="1.5"/>
    <circle cx="65" cy="82" r="1.2"/>
    <circle cx="135" cy="80" r="1.2"/>
    <circle cx="155" cy="86" r="1.5"/>
  </g>

  <!-- EEMT text -->
  <text x="100" y="186" text-anchor="middle" fill="white" font-family="Inter, system-ui, sans-serif"
        font-size="20" font-weight="700" letter-spacing="3">EEMT</text>
</svg>
